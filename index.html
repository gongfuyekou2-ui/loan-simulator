<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多機能 住宅ローン＆家計シミュレーター</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- アプリアイコンの設定（イラスト風住宅アイコン） -->
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/000000/real-estate.png">
  <style>
    :root {
      --primary-color: #007aff;
      --secondary-color: #34c759;
      --danger-color: #ff3b30;
      --purple-color: #af52de;
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-color: #1c1c1e;
      --border-color: #e5e5ea;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
    }
    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 16px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--primary-color);
    }
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .input-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      background-color: #fff;
    }
    .result-box {
      background-color: #f8f9fa;
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.88rem;
    }
    .result-row:last-child {
      margin-bottom: 0;
    }
    .result-value {
      font-weight: bold;
      font-size: 1rem;
    }
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .comp-card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      background-color: #fff;
    }
    .comp-title {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
      text-align: center;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
    }
    .chart-container {
      position: relative;
      height: 280px;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>住宅ローン＆繰り上げ返済シミュレーター</h1>

    <!-- 1. 基本条件 -->
    <div class="card">
      <div class="card-title">1. ローン基本条件</div>
      <div class="input-grid">
        <div class="input-group">
          <label for="amount">借入金額 (万円)</label>
          <input type="number" id="amount" value="3500" step="100">
        </div>
        <div class="input-group">
          <label for="rate">金利 (%)</label>
          <input type="number" id="rate" value="0.5" step="0.05">
        </div>
        <div class="input-group">
          <label for="years">返済期間 (年)</label>
          <input type="number" id="years" value="35" step="1">
        </div>
        <div class="input-group">
          <label for="income">世帯手取り月収 (万円)</label>
          <input type="number" id="income" value="45" step="1">
        </div>
      </div>
    </div>

    <!-- 2. 繰り上げ返済の設定 -->
    <div class="card">
      <div class="card-title">2. 繰り上げ返済実行条件</div>
      <div class="input-grid">
        <div class="input-group">
          <label for="prepayYear">繰り上げ時期 (経過年数)</label>
          <input type="number" id="prepayYear" value="10" step="1">
        </div>
        <div class="input-group">
          <label for="prepayAmount">繰り上げ返済額 (万円)</label>
          <input type="number" id="prepayAmount" value="300" step="50">
        </div>
      </div>

      <!-- 比較結果表示エリア -->
      <div class="comparison-grid">
        <div class="comp-card" style="border-top: 3px solid var(--primary-color);">
          <div class="comp-title" style="color: var(--primary-color);">① 期間短縮型</div>
          <div class="result-row">
            <span>毎月の返済:</span>
            <span id="shortMonthly" class="result-value">0 円</span>
          </div>
          <div class="result-row">
            <span>短縮期間:</span>
            <span id="shortSavedTime" class="result-value" style="color:var(--secondary-color);">0 ヶ月</span>
          </div>
          <div class="result-row">
            <span>軽減利息総額:</span>
            <span id="shortSavedInterest" class="result-value" style="color:var(--secondary-color);">0 万円</span>
          </div>
        </div>

        <div class="comp-card" style="border-top: 3px solid var(--purple-color);">
          <div class="comp-title" style="color: var(--purple-color);">② 返済額軽減型</div>
          <div class="result-row">
            <span>毎月の新返済額:</span>
            <span id="reduceMonthly" class="result-value" style="color:var(--purple-color);">0 円</span>
          </div>
          <div class="result-row">
            <span>毎月の減額幅:</span>
            <span id="reduceMonthlyDiff" class="result-value" style="color:var(--secondary-color);">0 円/月</span>
          </div>
          <div class="result-row">
            <span>軽減利息総額:</span>
            <span id="reduceSavedInterest" class="result-value" style="color:var(--secondary-color);">0 万円</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. 比較グラフ -->
    <div class="card">
      <div class="card-title">3. 返済方式別 残高推移の比較</div>
      <div class="chart-container">
        <canvas id="loanChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    let loanChart = null;

    function calculate() {
      const amountWan = parseFloat(document.getElementById('amount').value) || 0;
      const rate = parseFloat(document.getElementById('rate').value) || 0;
      const years = parseInt(document.getElementById('years').value) || 0;

      const prepayYear = parseInt(document.getElementById('prepayYear').value) || 0;
      const prepayAmountWan = parseFloat(document.getElementById('prepayAmount').value) || 0;

      const totalMonths = years * 12;
      const monthlyRate = (rate / 100) / 12;
      const principal = amountWan * 10000;
      const prepayVal = prepayAmountWan * 10000;

      if (principal <= 0 || totalMonths <= 0) return;

      // 1. 通常の毎月返済額
      const normalPMT = calcPMT(principal, monthlyRate, totalMonths);
      const prepayMonth = prepayYear * 12;

      // 繰り上げ時の直前残高
      let balanceAtPrepay = principal;
      let totalInterestNormal = 0;

      for (let m = 1; m <= prepayMonth; m++) {
        const interest = balanceAtPrepay * monthlyRate;
        totalInterestNormal += interest;
        balanceAtPrepay -= (normalPMT - interest);
      }

      // --- ① 期間短縮型の計算 ---
      const newBalShort = Math.max(0, balanceAtPrepay - prepayVal);
      let shortMonthsLeft = 0;
      let tempBal = newBalShort;
      let totalInterestShort = totalInterestNormal;

      while (tempBal > 0 && shortMonthsLeft < (totalMonths - prepayMonth)) {
        const interest = tempBal * monthlyRate;
        totalInterestShort += interest;
        const p = normalPMT - interest;
        tempBal -= p;
        shortMonthsLeft++;
      }

      const savedMonths = (totalMonths - prepayMonth) - shortMonthsLeft;
      
      // 通常の残り利息 vs 短縮型の残り利息
      let normalRemainingInterest = 0;
      let tempBalNorm = balanceAtPrepay;
      for (let m = prepayMonth + 1; m <= totalMonths; m++) {
        const interest = tempBalNorm * monthlyRate;
        normalRemainingInterest += interest;
        tempBalNorm -= (normalPMT - interest);
      }

      let shortRemainingInterest = 0;
      tempBal = newBalShort;
      for (let m = 0; m < shortMonthsLeft; m++) {
        const interest = tempBal * monthlyRate;
        shortRemainingInterest += interest;
        tempBal -= (normalPMT - interest);
      }

      const shortInterestSaved = normalRemainingInterest - shortRemainingInterest;

      // --- ② 返済額軽減型の計算 ---
      const newBalReduce = Math.max(0, balanceAtPrepay - prepayVal);
      const remainingMonths = totalMonths - prepayMonth;
      const newReducePMT = calcPMT(newBalReduce, monthlyRate, remainingMonths);

      let reduceRemainingInterest = 0;
      tempBal = newBalReduce;
      for (let m = 0; m < remainingMonths; m++) {
        const interest = tempBal * monthlyRate;
        reduceRemainingInterest += interest;
        tempBal -= (newReducePMT - interest);
      }

      const reduceInterestSaved = normalRemainingInterest - reduceRemainingInterest;

      // --- 画面表示更新 ---
      document.getElementById('shortMonthly').innerText = Math.round(normalPMT).toLocaleString() + ' 円';
      document.getElementById('shortSavedTime').innerText = Math.floor(savedMonths / 12) + '年 ' + (savedMonths % 12) + 'ヶ月';
      document.getElementById('shortSavedInterest').innerText = Math.round(shortInterestSaved / 10000).toLocaleString() + ' 万円';

      document.getElementById('reduceMonthly').innerText = Math.round(newReducePMT).toLocaleString() + ' 円';
      document.getElementById('reduceMonthlyDiff').innerText = '-' + Math.round(normalPMT - newReducePMT).toLocaleString() + ' 円';
      document.getElementById('reduceSavedInterest').innerText = Math.round(reduceInterestSaved / 10000).toLocaleString() + ' 万円';

      // --- グラフ用データ作成 ---
      const labels = [];
      const dataNormal = [];
      const dataShort = [];
      const dataReduce = [];

      let bNorm = principal;
      let bShort = principal;
      let bRed = principal;

      for (let y = 0; y <= years; y++) {
        labels.push(y + '年目');
        dataNormal.push(Math.round(bNorm / 10000));
        dataShort.push(Math.round(bShort / 10000));
        dataReduce.push(Math.round(bRed / 10000));

        // 1年（12ヶ月）進める
        for (let m = 0; m < 12; m++) {
          const currentM = y * 12 + m + 1;
          
          // 通常
          if (bNorm > 0) {
            bNorm -= (normalPMT - bNorm * monthlyRate);
            if (bNorm < 0) bNorm = 0;
          }

          // 短縮・軽減の分岐（繰り上げ実行）
          if (currentM === prepayMonth) {
            bShort = Math.max(0, bShort - prepayVal);
            bRed = Math.max(0, bRed - prepayVal);
          } else if (currentM > prepayMonth) {
            if (bShort > 0) {
              bShort -= (normalPMT - bShort * monthlyRate);
              if (bShort < 0) bShort = 0;
            }
            if (bRed > 0) {
              bRed -= (newReducePMT - bRed * monthlyRate);
              if (bRed < 0) bRed = 0;
            }
          } else {
            if (bShort > 0) bShort -= (normalPMT - bShort * monthlyRate);
            if (bRed > 0) bRed -= (normalPMT - bRed * monthlyRate);
          }
        }
      }

      updateChart(labels, dataNormal, dataShort, dataReduce);
    }

    function calcPMT(pv, rate, nper) {
      if (rate === 0) return pv / nper;
      return pv * (rate * Math.pow(1 + rate, nper)) / (Math.pow(1 + rate, nper) - 1);
    }

    function updateChart(labels, norm, short, reduce) {
      const ctx = document.getElementById('loanChart').getContext('2d');
      if (loanChart) loanChart.destroy();

      loanChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            { label: '繰り上げなし', data: norm, borderColor: '#8e8e93', borderDash: [5, 5], fill: false },
            { label: '① 期間短縮型', data: short, borderColor: '#007aff', backgroundColor: 'rgba(0,122,255,0.1)', fill: false },
            { label: '② 返済額軽減型', data: reduce, borderColor: '#af52de', backgroundColor: 'rgba(175,82,222,0.1)', fill: false }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: true, position: 'bottom' }
          },
          scales: {
            y: { beginAtZero: true, title: { display: true, text: '残高 (万円)' } }
          }
        }
      });
    }

    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => input.addEventListener('input', calculate));

    calculate();
  </script>
</body>
</html>
