<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>住宅ローン＆家計統合シミュレーター</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- アプリアイコンの設定（イラスト風住宅アイコン） -->
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/000000/real-estate.png">
  <style>
    :root {
      --primary-color: #007aff;
      --secondary-color: #34c759;
      --danger-color: #ff3b30;
      --purple-color: #af52de;
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-color: #1c1c1e;
      --border-color: #e5e5ea;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
    }
    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 16px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--primary-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .input-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      background-color: #fff;
    }
    .result-box {
      background-color: #f8f9fa;
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.88rem;
    }
    .result-row:last-child {
      margin-bottom: 0;
    }
    .result-value {
      font-weight: bold;
      font-size: 1rem;
    }
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .comp-card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      background-color: #fff;
    }
    .comp-title {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
      text-align: center;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
    }
    .chart-container {
      position: relative;
      height: 280px;
      width: 100%;
      margin-top: 10px;
    }
    .save-badge {
      font-size: 0.7rem;
      background-color: #e5f5e0;
      color: #2e7d32;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>住宅ローン＆家計統合シミュレーター</h1>

    <!-- 1. 基本条件 -->
    <div class="card">
      <div class="card-title">
        1. ローン基本条件
        <span class="save-badge">自動保存中</span>
      </div>
      <div class="input-grid">
        <div class="input-group">
          <label for="amount">借入金額 (万円)</label>
          <input type="number" id="amount" value="3500" step="100">
        </div>
        <div class="input-group">
          <label for="rate">当初金利 (%)</label>
          <input type="number" id="rate" value="0.5" step="0.05">
        </div>
        <div class="input-group">
          <label for="years">返済期間 (年)</label>
          <input type="number" id="years" value="35" step="1">
        </div>
        <div class="input-group">
          <label for="bonus">ボーナス加算 (万円/回)</label>
          <input type="number" id="bonus" value="0" step="1">
        </div>
      </div>
    </div>

    <!-- 2. 家計簿連携 -->
    <div class="card">
      <div class="card-title">2. 家計収支・貯蓄連携</div>
      <div class="input-grid">
        <div class="input-group">
          <label for="income">世帯手取り月収 (万円)</label>
          <input type="number" id="income" value="45" step="1">
        </div>
        <div class="input-group">
          <label for="livingCost">住居費以外の生活費 (万円)</label>
          <input type="number" id="livingCost" value="25" step="1">
        </div>
      </div>
      <div class="result-box">
        <div class="result-row">
          <span>毎月返済額 (当初):</span>
          <span class="result-value" id="monthlyPayment" style="color:var(--primary-color);">0 円</span>
        </div>
        <div class="result-row">
          <span>返済後の毎月手残り:</span>
          <span class="result-value" id="monthlySavings" style="color:var(--secondary-color);">0 円</span>
        </div>
        <div class="result-row">
          <span>年間貯蓄ペース (概算):</span>
          <span id="annualSavingsText" style="font-weight:bold;">0 万円/年</span>
        </div>
      </div>
    </div>

    <!-- 3. 繰り上げ返済比較 -->
    <div class="card">
      <div class="card-title">3. 繰り上げ返済シナリオ比較</div>
      <div class="input-grid">
        <div class="input-group">
          <label for="prepayYear">繰り上げ時期 (経過年数)</label>
          <input type="number" id="prepayYear" value="10" step="1">
        </div>
        <div class="input-group">
          <label for="prepayAmount">繰り上げ返済額 (万円)</label>
          <input type="number" id="prepayAmount" value="300" step="50">
        </div>
      </div>

      <div class="comparison-grid">
        <div class="comp-card" style="border-top: 3px solid var(--primary-color);">
          <div class="comp-title" style="color: var(--primary-color);">① 期間短縮型</div>
          <div class="result-row">
            <span>毎月の返済:</span>
            <span id="shortMonthly" class="result-value">0 円</span>
          </div>
          <div class="result-row">
            <span>短縮期間:</span>
            <span id="shortSavedTime" class="result-value" style="color:var(--secondary-color);">0 ヶ月</span>
          </div>
          <div class="result-row">
            <span>軽減利息:</span>
            <span id="shortSavedInterest" class="result-value" style="color:var(--secondary-color);">0 万円</span>
          </div>
        </div>

        <div class="comp-card" style="border-top: 3px solid var(--purple-color);">
          <div class="comp-title" style="color: var(--purple-color);">② 返済額軽減型</div>
          <div class="result-row">
            <span>毎月の新返済額:</span>
            <span id="reduceMonthly" class="result-value" style="color:var(--purple-color);">0 円</span>
          </div>
          <div class="result-row">
            <span>毎月の減額幅:</span>
            <span id="reduceMonthlyDiff" class="result-value" style="color:var(--secondary-color);">0 円/月</span>
          </div>
          <div class="result-row">
            <span>軽減利息:</span>
            <span id="reduceSavedInterest" class="result-value" style="color:var(--secondary-color);">0 万円</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. 金利上昇リスク＆控除 -->
    <div class="card">
      <div class="card-title">4. 金利上昇リスク＆住宅ローン控除</div>
      <div class="input-grid">
        <div class="input-group">
          <label for="riseYear">金利上昇時期 (年後)</label>
          <input type="number" id="riseYear" value="5" step="1">
        </div>
        <div class="input-group">
          <label for="newRate">上昇後の金利 (%)</label>
          <input type="number" id="newRate" value="1.0" step="0.1">
        </div>
      </div>
      <div class="result-box">
        <div class="result-row">
          <span>住宅ローン控除概算 (13年間):</span>
          <span id="taxDeductionText" style="color:var(--secondary-color); font-weight:bold;">約 0 万円還元</span>
        </div>
      </div>
    </div>

    <!-- 5. 比較グラフ -->
    <div class="card">
      <div class="card-title">5. 残高推移グラフ（3パターン比較）</div>
      <div class="chart-container">
        <canvas id="loanChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    let loanChart = null;

    // 入力値の復元関数 (localStorage)
    function restoreInputs() {
      const inputs = document.querySelectorAll('input');
      inputs.forEach(input => {
        const savedVal = localStorage.getItem('loan_sim_' + input.id);
        if (savedVal !== null) {
          input.value = savedVal;
        }
      });
    }

    // 入力値の保存関数 (localStorage)
    function saveInputs() {
      const inputs = document.querySelectorAll('input');
      inputs.forEach(input => {
        localStorage.setItem('loan_sim_' + input.id, input.value);
      });
    }

    function calculate() {
      saveInputs(); // 計算時に数値を記憶

      const amountWan = parseFloat(document.getElementById('amount').value) || 0;
      const initialRate = parseFloat(document.getElementById('rate').value) || 0;
      const years = parseInt(document.getElementById('years').value) || 0;
      const bonusWan = parseFloat(document.getElementById('bonus').value) || 0;

      const monthlyIncome = parseFloat(document.getElementById('income').value) || 0;
      const livingCost = parseFloat(document.getElementById('livingCost').value) || 0;

      const prepayYear = parseInt(document.getElementById('prepayYear').value) || 0;
      const prepayAmountWan = parseFloat(document.getElementById('prepayAmount').value) || 0;

      const riseYear = parseInt(document.getElementById('riseYear').value) || 0;
      const newRate = parseFloat(document.getElementById('newRate').value) || 0;

      const totalMonths = years * 12;
      const monthlyRate = (initialRate / 100) / 12;
      const principal = amountWan * 10000;
      const prepayVal = prepayAmountWan * 10000;

      if (principal <= 0 || totalMonths <= 0) return;

      // 初期の基本毎月返済額
      const normalPMT = calcPMT(principal, monthlyRate, totalMonths);
      document.getElementById('monthlyPayment').innerText = Math.round(normalPMT).toLocaleString() + ' 円';

      // 家計計算
      const monthlySavingsVal = (monthlyIncome * 10000) - (livingCost * 10000) - normalPMT;
      const savingsElem = document.getElementById('monthlySavings');
      savingsElem.innerText = Math.round(monthlySavingsVal).toLocaleString() + ' 円';
      savingsElem.style.color = monthlySavingsVal < 0 ? 'var(--danger-color)' : 'var(--secondary-color)';
      document.getElementById('annualSavingsText').innerText = Math.round((monthlySavingsVal * 12) / 10000) + ' 万円/年';

      // 繰り上げ返済前の状態集計
      const prepayMonth = prepayYear * 12;
      let balanceAtPrepay = principal;

      for (let m = 1; m <= prepayMonth; m++) {
        const interest = balanceAtPrepay * monthlyRate;
        balanceAtPrepay -= (normalPMT - interest);
      }

      // --- ① 期間短縮型 ---
      const newBalShort = Math.max(0, balanceAtPrepay - prepayVal);
      let shortMonthsLeft = 0;
      let tempBal = newBalShort;
      while (tempBal > 0 && shortMonthsLeft < (totalMonths - prepayMonth)) {
        const interest = tempBal * monthlyRate;
        tempBal -= (normalPMT - interest);
        shortMonthsLeft++;
      }
      const savedMonths = (totalMonths - prepayMonth) - shortMonthsLeft;

      let normalRemainingInterest = 0;
      let tempBalNorm = balanceAtPrepay;
      for (let m = prepayMonth + 1; m <= totalMonths; m++) {
        const interest = tempBalNorm * monthlyRate;
        normalRemainingInterest += interest;
        tempBalNorm -= (normalPMT - interest);
      }

      let shortRemainingInterest = 0;
      tempBal = newBalShort;
      for (let m = 0; m < shortMonthsLeft; m++) {
        const interest = tempBal * monthlyRate;
        shortRemainingInterest += interest;
        tempBal -= (normalPMT - interest);
      }
      const shortInterestSaved = normalRemainingInterest - shortRemainingInterest;

      // --- ② 返済額軽減型 ---
      const newBalReduce = Math.max(0, balanceAtPrepay - prepayVal);
      const remainingMonths = totalMonths - prepayMonth;
      const newReducePMT = calcPMT(newBalReduce, monthlyRate, remainingMonths);

      let reduceRemainingInterest = 0;
      tempBal = newBalReduce;
      for (let m = 0; m < remainingMonths; m++) {
        const interest = tempBal * monthlyRate;
        reduceRemainingInterest += interest;
        tempBal -= (newReducePMT - interest);
      }
      const reduceInterestSaved = normalRemainingInterest - reduceRemainingInterest;

      // --- 画面表示（繰り上げ比較） ---
      document.getElementById('shortMonthly').innerText = Math.round(normalPMT).toLocaleString() + ' 円';
      document.getElementById('shortSavedTime').innerText = Math.floor(savedMonths / 12) + '年 ' + (savedMonths % 12) + 'ヶ月';
      document.getElementById('shortSavedInterest').innerText = Math.round(shortInterestSaved / 10000).toLocaleString() + ' 万円';

      document.getElementById('reduceMonthly').innerText = Math.round(newReducePMT).toLocaleString() + ' 円';
      document.getElementById('reduceMonthlyDiff').innerText = '-' + Math.round(normalPMT - newReducePMT).toLocaleString() + ' 円';
      document.getElementById('reduceSavedInterest').innerText = Math.round(reduceInterestSaved / 10000).toLocaleString() + ' 万円';

      // --- 住宅ローン控除概算 ---
      let taxDeductionTotal = 0;
      let tempTaxBal = principal;
      for (let m = 1; m <= 156; m++) {
        const interest = tempTaxBal * monthlyRate;
        tempTaxBal -= (normalPMT - interest);
        if (m % 12 === 0) {
          taxDeductionTotal += Math.min(tempTaxBal * 0.007, 210000);
        }
      }
      document.getElementById('taxDeductionText').innerText = '約 ' + Math.round(taxDeductionTotal / 10000).toLocaleString() + ' 万円還元';

      // --- グラフ描画 ---
      const labels = [];
      const dataNormal = [];
      const dataShort = [];
      const dataReduce = [];

      let bNorm = principal;
      let bShort = principal;
      let bRed = principal;

      for (let y = 0; y <= years; y++) {
        labels.push(y + '年目');
        dataNormal.push(Math.round(bNorm / 10000));
        dataShort.push(Math.round(bShort / 10000));
        dataReduce.push(Math.round(bRed / 10000));

        for (let m = 0; m < 12; m++) {
          const currentM = y * 12 + m + 1;
          
          if (bNorm > 0) bNorm = Math.max(0, bNorm - (normalPMT - bNorm * monthlyRate));

          if (currentM === prepayMonth) {
            bShort = Math.max(0, bShort - prepayVal);
            bRed = Math.max(0, bRed - prepayVal);
          } else if (currentM > prepayMonth) {
            if (bShort > 0) bShort = Math.max(0, bShort - (normalPMT - bShort * monthlyRate));
            if (bRed > 0) bRed = Math.max(0, bRed - (newReducePMT - bRed * monthlyRate));
          } else {
            if (bShort > 0) bShort = Math.max(0, bShort - (normalPMT - bShort * monthlyRate));
            if (bRed > 0) bRed = Math.max(0, bRed - (normalPMT - bRed * monthlyRate));
          }
        }
      }

      updateChart(labels, dataNormal, dataShort, dataReduce);
    }

    function calcPMT(pv, rate, nper) {
      if (rate === 0) return pv / nper;
      return pv * (rate * Math.pow(1 + rate, nper)) / (Math.pow(1 + rate, nper) - 1);
    }

    function updateChart(labels, norm, short, reduce) {
      const ctx = document.getElementById('loanChart').getContext('2d');
      if (loanChart) loanChart.destroy();

      loanChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            { label: '繰り上げなし', data: norm, borderColor: '#8e8e93', borderDash: [5, 5], fill: false },
            { label: '① 期間短縮型', data: short, borderColor: '#007aff', backgroundColor: 'rgba(0,122,255,0.1)', fill: false },
            { label: '② 返済額軽減型', data: reduce, borderColor: '#af52de', backgroundColor: 'rgba(175,82,222,0.1)', fill: false }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: true, position: 'bottom' } },
          scales: { y: { beginAtZero: true, title: { display: true, text: '残高 (万円)' } } }
        }
      });
    }

    // 初期化処理：保存値を復元してから計算・リスナー登録
    restoreInputs();

    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => input.addEventListener('input', calculate));

    calculate();
  </script>
</body>
</html>
