<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>住宅ローンシミュレーター</title>
  <style>
    :root {
      --primary-color: #007aff;
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-color: #1c1c1e;
      --border-color: #e5e5ea;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .input-group {
      margin-bottom: 16px;
    }
    .input-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      background-color: #fff;
    }
    .result-title {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 4px;
    }
    .result-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary-color);
    }
    .result-sub {
      font-size: 1rem;
      color: #333;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>住宅ローン計算</h1>

    <div class="card">
      <div class="input-group">
        <label for="amount">借入金額 (万円)</label>
        <input type="number" id="amount" value="3000" step="10">
      </div>

      <div class="input-group">
        <label for="rate">金利 (%)</label>
        <input type="number" id="rate" value="0.5" step="0.01">
      </div>

      <div class="input-group">
        <label for="years">返済期間 (年)</label>
        <input type="number" id="years" value="35" step="1">
      </div>
    </div>

    <div class="card">
      <div class="result-title">毎月の返済額</div>
      <div class="result-value" id="monthly-payment">0 円</div>
      
      <div class="result-sub">
        <div>総返済額: <strong id="total-payment">0</strong> 円</div>
        <div>総利息額: <strong id="total-interest">0</strong> 円</div>
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      const amountWan = parseFloat(document.getElementById('amount').value) || 0;
      const annualRate = parseFloat(document.getElementById('rate').value) || 0;
      const years = parseInt(document.getElementById('years').value) || 0;

      const principal = amountWan * 10000;
      const monthlyRate = (annualRate / 100) / 12;
      const numPayments = years * 12;

      if (principal <= 0 || numPayments <= 0) {
        document.getElementById('monthly-payment').innerText = '0 円';
        document.getElementById('total-payment').innerText = '0';
        document.getElementById('total-interest').innerText = '0';
        return;
      }

      let monthlyPayment = 0;
      if (monthlyRate === 0) {
        monthlyPayment = principal / numPayments;
      } else {
        monthlyPayment = principal * (monthlyRate * Math.pow(1 + monthlyRate, numPayments)) / (Math.pow(1 + monthlyRate, numPayments) - 1);
      }

      const totalPayment = monthlyPayment * numPayments;
      const totalInterest = totalPayment - principal;

      document.getElementById('monthly-payment').innerText = Math.round(monthlyPayment).toLocaleString() + ' 円';
      document.getElementById('total-payment').innerText = Math.round(totalPayment).toLocaleString();
      document.getElementById('total-interest').innerText = Math.round(totalInterest).toLocaleString();
    }

    document.getElementById('amount').addEventListener('input', calculate);
    document.getElementById('rate').addEventListener('input', calculate);
    document.getElementById('years').addEventListener('input', calculate);

    calculate();
  </script>
</body>
</html>
